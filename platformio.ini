; Configuration des vingt programmes actifs. Exécuter pio run -e NOM depuis la racine.
; Les dossiers avec soulignés sont des brouillons : aucun n’est compilé implicitement.
[platformio]
default_envs = diagnostic
src_dir = experiments
core_dir = .platformio
build_cache_dir = .pio/cache

; Paramètres communs : ESP32-S3, flash 8 Mio et versions de bibliothèques figées.
[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; Les chemins symlink conservent une seule copie des sources tierces locales.
lib_deps =
    symlink://upstream/sources/m5gfx
    symlink://upstream/sources/m5unified
    symlink://upstream/sources/m5cardputer
    arduino-irremote/IRremote@4.7.1

[env:diagnostic]
build_src_filter = -<*> +<01-diagnostic/main.cpp>

[env:notes-sd]
build_src_filter = -<*> +<02-notes-sd/main.cpp>

[env:micro-wav]
build_src_filter = -<*> +<03-micro-wav/main.cpp>

[env:wifi-scan]
build_src_filter = -<*> +<04-wifi-scan/main.cpp>

[env:wifi-web]
build_src_filter = -<*> +<05-wifi-web/main.cpp>

[env:ble-scan]
build_src_filter = -<*> +<06-ble-scan/main.cpp>

[env:ble-balise]
build_src_filter = -<*> +<07-ble-balise/main.cpp>

[env:ir-tv]
build_src_filter = -<*> +<08-ir-tv/main.cpp>
lib_deps =
    ${env.lib_deps}
    symlink://upstream/sources/irremote

[env:i2c-scan]
build_src_filter = -<*> +<09-i2c-scan/main.cpp>

[env:ir-reflectif]
build_src_filter = -<*> +<10-ir-reflectif/main.cpp>

[env:rf433-rx]
build_src_filter = -<*> +<11-rf433-rx/main.cpp>
lib_deps =
    ${env.lib_deps}
    symlink://upstream/sources/rc-switch

[env:rf433-tx]
build_src_filter = -<*> +<12-rf433-tx/main.cpp>
lib_deps =
    ${env.lib_deps}
    symlink://upstream/sources/rc-switch

[env:rfid-uid]
build_src_filter = -<*> +<13-rfid-uid/main.cpp>

[env:rfid-bloc]
build_src_filter = -<*> +<14-rfid-bloc/main.cpp>

[env:gps]
build_src_filter = -<*> +<15-gps/main.cpp>
lib_deps =
    ${env.lib_deps}
    symlink://upstream/sources/tinygpsplus

[env:gps-sd]
build_src_filter = -<*> +<16-gps-sd/main.cpp>
lib_deps =
    ${env.lib_deps}
    symlink://upstream/sources/tinygpsplus

[env:espnow]
build_src_filter = -<*> +<17-espnow/main.cpp>

; Cette cible active l’USB natif HID ; elle remplace les flags USB communs.
[env:usb-clavier]
build_src_filter = -<*> +<18-usb-clavier/main.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=0

[env:fm-rda5807]
build_src_filter = -<*> +<19-fm-rda5807/main.cpp>
lib_deps =
    ${env.lib_deps}
    symlink://upstream/sources/rda5807

[env:nrf24]
build_src_filter = -<*> +<20-nrf24/main.cpp>
lib_deps =
    ${env.lib_deps}
    symlink://upstream/sources/rf24
