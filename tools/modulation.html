<!doctype html>
<!-- Documentation française : Outil autonome hors ligne : ouvrir ce fichier dans un navigateur. Voir README.md pour le parcours et les limites. --><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Modulations — Cardputer Lab</title><style>body{background:#0c1727;color:#edf4ff;font:18px system-ui;max-width:1000px;margin:40px auto;padding:20px}label{display:inline-block;margin:15px 25px 15px 0}select,input{font:inherit}svg{background:#182b43;border-radius:12px;width:100%;height:auto}p{line-height:1.6;color:#bfd1e6}a{color:#76dace}</style><h1>Voir une modulation</h1><p>Le tracé montre une porteuse pédagogique dans le temps. Cet outil fonctionne localement : il ne pilote aucune radio.</p><label>Mode <select id="mode"><option>OOK</option><option>FSK</option><option>FM</option></select></label><label>Déviation <input id="deviation" type="range" min="1" max="15" value="7"></label><svg viewBox="0 0 1000 330" role="img" aria-label="Signal modulé et signal de commande"><path id="wave" fill="none" stroke="#72e5d2" stroke-width="2"/><path id="control" fill="none" stroke="#f0c36a" stroke-width="2"/><text x="20" y="28" fill="white">Porteuse modulée</text><text x="20" y="225" fill="white">Commande (bits ou signal analogique)</text></svg><p id="explanation"></p><p>Amplitude, temps et fréquences sont sans unités RF réelles. L’antenne, le bruit, les filtres et la démodulation ne sont pas simulés. <a href="../docs/experiences/fm.md">Retour au guide FM</a>.</p><script>
/* draw recalcule deux chemins SVG : phase intégrée de la porteuse et commande.
   OOK agit sur l’amplitude ; FSK choisit deux fréquences ; FM suit la sinusoïde.
   Les coordonnées sont graphiques, sans unités radio ni interaction matérielle. */
function draw(){let mode=document.querySelector('#mode').value,dev=+document.querySelector('#deviation').value,phase=0,wave='',control='';for(let x=0;x<=1000;x++){let t=x/1000,bit=[1,0,1,1,0,0,1,0][Math.min(7,Math.floor(t*8))],m=Math.sin(2*Math.PI*2*t),freq=mode==='FM'?32+dev*m:mode==='FSK'?32+dev*(bit?1:-1):32;phase+=2*Math.PI*freq/1000;let y=115-65*Math.sin(phase)*(mode==='OOK'?bit:1),cy=275-25*(mode==='FM'?m:2*bit-1);wave+=(x?'L':'M')+x+','+y.toFixed(2);control+=(x?'L':'M')+x+','+cy.toFixed(2)}document.querySelector('#wave').setAttribute('d',wave);document.querySelector('#control').setAttribute('d',control);document.querySelector('#explanation').textContent={OOK:'OOK : la porteuse est présente ou coupée selon le bit. Les modules RF433 du laboratoire emploient des impulsions de cette famille.',FSK:'FSK : deux fréquences distinctes représentent les deux états binaires. La fréquence change ; l’amplitude reste constante.',FM:'FM : la fréquence instantanée suit un signal analogique continu. La commande sinusoïdale représente ici un son très simplifié.'}[mode]};document.querySelectorAll('select,input').forEach(x=>x.addEventListener('input',draw));draw();</script></html>
