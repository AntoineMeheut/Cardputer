# Pipeline sans matériel : restaurer les sources, contrôler la documentation, tester puis compiler.
# Le téléversement sur Cardputer ne fait pas partie de cette automatisation.
name: Vérifications du laboratoire
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contrôler les fichiers destinés au dépôt
        run: python tools/prepare_publication.py --check
      - name: Installer les outils
        run: python -m pip install -r requirements.txt
      - name: Restaurer les instantanés figés
        run: python tools/fetch_upstream.py
      - name: Vérifier les empreintes
        run: python tools/fetch_upstream.py --verify
      - name: Vérifier les liens et tests sur ordinateur
        run: |
          python tools/check_docs.py
          python tools/check_documentation.py
          python tools/test_host.py
      - name: Compiler les vingt expériences
        run: python tools/build_all.py
      # Conserver les journaux même si une cible échoue pour permettre le diagnostic.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-compilation
          path: build/
