<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 527" role="img" aria-label="NRF24 : extension par adaptateur microSD / SPI">
<rect width="1100" height="527" rx="20" fill="#101e31"/>
<style>text{font-family:Arial,sans-serif;fill:#edf4ff}.title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#a8bdd5}.pin{font-size:18px}.small{font-size:14px;fill:#b7cadd}</style>
<text class="title" x="40" y="48">NRF24 : extension par adaptateur microSD / SPI</text><text class="sub" x="40" y="80">Matériel supplémentaire · aucune carte SD · deux stations</text><rect x="40" y="89" width="1020" height="39" rx="6" fill="#223750"/><text class="pin" x="58" y="115">Grove 5 V → régulateur 3,3 V</text><text class="pin" x="510" y="115">Sortie 3,3 V → VCC du NRF24</text><rect x="40" y="133" width="1020" height="39" rx="6" fill="#192b42"/><text class="pin" x="58" y="159">GND</text><text class="pin" x="510" y="159">GND du NRF24 et du régulateur</text><rect x="40" y="177" width="1020" height="39" rx="6" fill="#223750"/><text class="pin" x="58" y="203">microSD CLK / G40</text><text class="pin" x="510" y="203">SCK du NRF24</text><rect x="40" y="221" width="1020" height="39" rx="6" fill="#192b42"/><text class="pin" x="58" y="247">microSD CMD / MOSI / G14</text><text class="pin" x="510" y="247">MOSI du NRF24</text><rect x="40" y="265" width="1020" height="39" rx="6" fill="#223750"/><text class="pin" x="58" y="291">microSD DAT0 / MISO / G39</text><text class="pin" x="510" y="291">MISO du NRF24</text><rect x="40" y="309" width="1020" height="39" rx="6" fill="#192b42"/><text class="pin" x="58" y="335">Grove G2 / jaune</text><text class="pin" x="510" y="335">CE du NRF24</text><rect x="40" y="353" width="1020" height="39" rx="6" fill="#223750"/><text class="pin" x="58" y="379">Grove G1 / blanc</text><text class="pin" x="510" y="379">CSN du NRF24</text><rect x="40" y="397" width="1020" height="39" rx="6" fill="#192b42"/><text class="pin" x="58" y="423">G12 maintenu haut ; IRQ libre</text><text class="pin" x="510" y="423">Vérifier les signaux de l’adaptateur</text><text class="small" x="40" y="505">Ne jamais alimenter le NRF24 nu directement avec le 5 V Grove. Montage de principe à valider.</text></svg>